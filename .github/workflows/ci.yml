name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.14 checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Create project environment
        run: make setup PYTHON=python
      - name: Install runtime and development dependencies
        run: make dev
      - name: Dependency consistency
        run: .venv/bin/python -m pip check
      - name: Public file scope
        run: make check-public
      - name: Python syntax
        run: make check
      - name: Lint and formatting
        run: make lint
      - name: Offline tests
        run: make test
      - name: Whitespace errors
        run: git diff --check
